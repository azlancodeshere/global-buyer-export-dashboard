# Keeps the backend Vercel function warm so it is ready when you open the
# dashboard. The endpoint is hit every 12 minutes (under the 15-minute idle
# window) plus on demand via workflow_dispatch.
#
# Note: GitHub only runs scheduled workflows on the default branch, and pauses
# them after 60 days without repository activity — push any commit to resume.
name: Keep backend warm

on:
  schedule:
    - cron: '*/12 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    name: Ping /api/health
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Curl backend health endpoint
        env:
          BACKEND_URL: https://global-buyer-export-dashboard-serve.vercel.app
        run: |
          set -u
          for attempt in 1 2 3; do
            code=$(curl -sS -o /tmp/health.json -w '%{http_code}' \
              --max-time 30 "$BACKEND_URL/api/health" || echo 000)
            echo "attempt $attempt -> HTTP $code"
            if [ "$code" = "200" ]; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 10
          done
          echo "::error::Backend did not answer with HTTP 200"
          exit 1
